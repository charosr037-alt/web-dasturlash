<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Zarafshon kafe taomlari katalogi, qidiruv, filtr va narxlar.">
    <title>Zarafshon kafe | Katalog</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body id="yuqori">
    <header>
        <p class="belgi">ZARAFSHON KAFE</p>
        <div class="header-boshqaruv">
            <button type="button" class="tungi-rejim-btn" aria-pressed="false">Tungi rejim</button>
            <a href="katalog.html" class="sevimli-badge">Sevimlilar: <span class="sevimli-soni">0</span></a>
            <button type="button" id="burger-btn" class="burger-btn" aria-label="Menyuni ochish" aria-expanded="false">☰</button>
        </div>
        <nav id="asosiy-nav" aria-label="Asosiy navigatsiya">
            <ul>
                <li><a href="index.html">Bosh sahifa</a></li>
                <li><a href="katalog.html" aria-current="page">Katalog</a></li>
                <li><a href="aloqa.html">Aloqa</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h1>Menyu katalogi</h1>
        </section>

        <section aria-labelledby="statistika-sarlavha">
            <h2 id="statistika-sarlavha">Menyu statistikasi</h2>
            <div class="statistika-qator">
                <article class="stat-quti">
                    <span>Jami taomlar soni</span>
                    <strong id="stat-jami">0</strong>
                </article>
                <article class="stat-quti">
                    <span>O'rtacha narx</span>
                    <strong id="stat-ortacha">0 so'm</strong>
                </article>
                <article class="stat-quti">
                    <span>Eng qimmat taom</span>
                    <strong id="stat-eng-qimmat">—</strong>
                </article>
            </div>
        </section>

        <section aria-labelledby="filtr-sarlavha">
            <h2 id="filtr-sarlavha">Qidiruv, filtr va saralash</h2>
            <div class="filtr-boshqaruv">
                <div class="maydon">
                    <label for="qidiruv-input">Taom nomi yoki teg bo'yicha qidiruv</label>
                    <input type="text" id="qidiruv-input" placeholder="Masalan: palov, somsa, choy...">
                </div>

                <div class="maydon">
                    <label for="kategoriya-select">Kategoriya</label>
                    <select id="kategoriya-select">
                        <option value="barchasi">Barchasi</option>
                        <option value="milliy">Milliy taomlar</option>
                        <option value="salat">Salatlar</option>
                        <option value="ichimlik">Ichimliklar</option>
                        <option value="shirinlik">Shirinliklar</option>
                    </select>
                </div>

                <div class="maydon">
                    <label for="saralash-select">Saralash</label>
                    <select id="saralash-select">
                        <option value="standart">Standart</option>
                        <option value="narx-osish">Narx: o'sish tartibida</option>
                        <option value="narx-kamayish">Narx: kamayish tartibida</option>
                        <option value="nom-az">Nom: A — Z</option>
                        <option value="nom-za">Nom: Z — A</option>
                    </select>
                </div>

                <div class="belgi-qator filtr-checkbox">
                    <input type="checkbox" id="faqat-mavjud">
                    <label for="faqat-mavjud">Faqat mavjud taomlarni ko'rsatish</label>
                </div>
            </div>

            <p class="natija-hisob">Ko'rsatilayotgan taomlar soni: <strong id="natija-soni">0</strong></p>
            <p id="bosh-xabar" class="bosh-xabar" hidden></p>

            <div id="katalog-konteyner" class="kartalar"></div>
        </section>
    </main>

    <!-- Modal oyna -->
    <div id="taom-modal" class="modal-fon" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modal-nom">
        <div class="modal-oyna">
            <button type="button" id="modal-yopish" class="modal-yopish" aria-label="Yopish">&times;</button>
            <img id="modal-rasm" src="" alt="" class="modal-rasm">
            <p id="modal-kategoriya" class="karta-kategoriya"></p>
            <h3 id="modal-nom"></h3>
            <p id="modal-tavsif"></p>
            <div id="modal-teglar" class="teglar"></div>
            <p><strong>Narxi:</strong> <span id="modal-narx"></span></p>
            <p><strong>Holati:</strong> <span id="modal-holat"></span></p>
            <button type="button" id="modal-sevimli-btn" class="btn-asosiy">Sevimlilarga qo'shish</button>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/katalog.js"></script>
</body>
</html>
